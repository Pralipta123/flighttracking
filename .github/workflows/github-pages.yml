# Builds the Angular app and deploys static files to GitHub Pages.
# Site URL: https://<user>.github.io/<repo>/  →  base-href must match repo name.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production, GitHub Pages base href)
        run: npm run build -- --configuration production --base-href /flighttracking/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/flighttracking

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
